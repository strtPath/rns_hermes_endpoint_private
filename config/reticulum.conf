[reticulum]
  share_instance = True
  default_algorithm = curve25519
  tcp_port = 4321

[interfaces]
  [[TCP Server Interface]]
    type = TCPServerInterface
    enabled = yes
    listen_ip = 0.0.0.0
    listen_port = 37428

  # Optional: connect to an existing Reticulum mesh peer (e.g. another node or hub).
  # Disabled by default — a placeholder target_host would make every fresh node
  # attempt (and fail) to resolve YOUR_MESH_PEER_HOST on startup. Enable and
  # fill in real values only when you have a peer to link to.
  [[TCP Client]]
    type = TCPClientInterface
    enabled = no
    target_host = YOUR_MESH_PEER_HOST
    target_port = YOUR_MESH_PEER_PORT
